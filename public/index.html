.lwrap{width:100%;max-width:400px;display:flex;flex-direction:column;align-items:stretch}
.login .ltitle{font:700 clamp(34px,6vw,46px)/1.05 var(--f-d);text-align:center;color:#14233A;margin:0 0 8px;letter-spacing:-.02em}
.lsub{text-align:center;color:#3F5470;font-size:17px;margin:0 0 26px}
.login .box{background:rgba(255,255,255,.34);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.65);box-shadow:none;border-radius:16px}
.login .in{padding:24px 24px 20px}
.login input[type=text],.login input[type=password]{background:rgba(255,255,255,.28);border:1px solid rgba(20,35,58,.16);border-radius:10px}
.login input[type=text]:focus,.login input[type=password]:focus{background:rgba(255,255,255,.85);border-color:#2F7FD6;outline:none}
.login .field label{font-size:11px;color:#3F5470}
.lwrap{max-width:560px}
.login .box{width:100%;max-width:400px;align-self:center}
.login .ltitle{font-size:clamp(30px,8vw,46px);white-space:nowrap}
@media (max-width:760px){
.top .in{gap:8px 10px}
.top .who{margin-left:auto;flex-wrap:nowrap}
.top .who .avatar{display:none}
nav.main{order:3;flex:0 0 100%;flex-wrap:nowrap;overflow-x:auto;gap:2px;margin:0 -4px;padding-bottom:2px;-webkit-overflow-scrolling:touch}
nav.main button{white-space:nowrap;flex:none}
}
.cmod::after,.c-yellow::after{display:none!important}

.login .llogo{display:block;width:min(100%,440px);height:auto;margin:0 auto 6px}
.lsig{display:flex;justify-content:center;margin:0 auto 26px;width:min(100%,380px)}
.sig{width:100%;height:auto;overflow:visible}
.sig path{fill:transparent;stroke:#1F6BC2;stroke-width:26;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1}
.sig.go path{animation:sdraw 1.1s cubic-bezier(.5,0,.3,1) calc(var(--i)*.09s + .15s) forwards,sfill .5s ease calc(var(--i)*.09s + .9s) forwards}
@keyframes sdraw{to{stroke-dashoffset:0}}
@keyframes sfill{to{fill:#1F6BC2;stroke-width:6}}
@media (prefers-reduced-motion:reduce){.sig path{stroke-dashoffset:0;fill:#1F6BC2;stroke-width:6;animation:none!important}}

/* ---------- API ---------- */
async function api(method,path,body){
  const r=await fetch('/api'+path,{method,credentials:'same-origin',headers:{'content-type':'application/json','x-requested-with':'trilha-videos'},body:body===undefined?undefined:JSON.stringify(body),keepalive:method!=='GET'&&body&&JSON.stringify(body).length<60000});
  let j={};try{j=await r.json();}catch(e){}
  if(!r.ok){const e=new Error(j.erro||('Erro '+r.status));e.status=r.status;if(r.status===401&&path!=='/login')showLogin();throw e;}
  return j;
}

let ME=null,TR={modulos:[]},PR=novoPR(),NT={};

const V={name:'home',mod:null,vid:null,tab:'notas',replyTo:null,edit:null,confirm:null};
function novoPR(){return {pos:{},done:{},dur:{},dias:[],ult:''};}
const allVids=()=>TR.modulos.flatMap(m=>m.vids.map(v=>Object.assign({mod:m},v)));
const vid=id=>allVids().find(v=>v.id===id);
const durOf=(P,v)=>(P.dur&&P.dur[v.id])||v.min*60;
const vpOf=(P,v)=>P.done&&P.done[v.id]?1:Math.min(1,((P.pos&&P.pos[v.id])||0)/durOf(P,v));
const mpOf=(P,m)=>m.vids.length?m.vids.reduce((a,v)=>a+vpOf(P,v),0)/m.vids.length:0;
const mdoneOf=(P,m)=>m.vids.length>0&&m.vids.every(v=>P.done&&P.done[v.id]);
const totalOf=P=>{const a=allVids();return a.length?a.reduce((s,v)=>s+vpOf(P,v),0)/a.length:0;};
const vp=v=>vpOf(PR,v),mp=m=>mpOf(PR,m),mdone=m=>mdoneOf(PR,m),total=()=>totalOf(PR),dur=v=>durOf(PR,v);
const isDone=id=>!!PR.done[id];
const posOf=id=>PR.pos[id]||0;
const nextOf=id=>{const a=allVids();const i=a.findIndex(v=>v.id===id);return a[i+1]||null;};
const ini=n=>String(n||'?').trim()[0].toUpperCase();
const primeiro=n=>String(n||'').trim().split(/\s+/)[0].replace(/^./,c=>c.toUpperCase());
const hoje=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const diaStr=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function streakOf(dias){
  const s=new Set(dias||[]);let d=new Date();if(!s.has(diaStr(d)))d.setDate(d.getDate()-1);
  let n=0;while(s.has(diaStr(d))){n++;d.setDate(d.getDate()-1);}return n;
}
function ago(iso){
  if(!iso)return null;const t=new Date(iso).getTime();if(!t)return null;
  const d=Math.floor((new Date(hoje()+'T00:00:00').getTime()-new Date(diaStr(new Date(t))+'T00:00:00').getTime())/864e5);
  return d<=0?'hoje':d===1?'ontem':'há '+d+' dias';
}

function ring(pc){const C=2*Math.PI*80;return '<div class="ring"><svg viewBox="0 0 200 200" role="img" aria-label="Progresso geral: '+pc+'%"><g transform="rotate(-90 100 100)"><circle class="trk" cx="100" cy="100" r="80" fill="none" stroke-width="16"/><circle class="fg" id="ringfg" cx="100" cy="100" r="80" fill="none" stroke-width="16" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+C+'" data-to="'+(C*(1-pc/100))+'"/></g></svg><div class="tx"><b>'+pc+'%</b><span>concluído</span></div></div>';}

  +'<div class="stats" style="grid-template-columns:repeat(3,minmax(0,1fr))"><div class="card stat"><b>'+(tot-done)+'</b><span>aulas para terminar</span></div><div class="card stat"><b>'+n+(n===1?' dia':' dias')+'</b><span>de sequência</span></div><div class="card stat"><b>'+Math.floor(secs/60)+'h '+String(secs%60).padStart(2,'0')+'min</b><span>assistidos</span></div></div>'

/* ---------- aula + player ---------- */
let YTP=null,ytTimer=null,ytLoading=null,lastSaveSec=-99;
function killPlayer(){clearInterval(ytTimer);ytTimer=null;if(YTP){try{YTP.destroy();}catch(e){}YTP=null;}}
function loadYT(){
  if(window.YT&&window.YT.Player)return Promise.resolve();
  if(ytLoading)return ytLoading;
  ytLoading=new Promise((res,rej)=>{
    const to=setTimeout(()=>{ytLoading=null;rej(new Error('timeout'));},8000);
    const prev=window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady=()=>{clearTimeout(to);if(prev)try{prev();}catch(e){}res();};
    const s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';s.onerror=()=>{clearTimeout(to);ytLoading=null;rej(new Error('erro'));};document.head.appendChild(s);
  });
  return ytLoading;
}
function setPos(v,t,d){
  t=Math.max(0,t);PR.pos[v.id]=Math.floor(t);
  if(d>30&&Math.abs((PR.dur[v.id]||0)-d)>2)PR.dur[v.id]=Math.round(d);
  marcaDia();
  const nm=$('#nmin');if(nm)nm.textContent=fmt(t);
  const pb=$('#pbar');if(pb)pb.style.width=Math.round(vp(v)*100)+'%';
  if(!isDone(v.id)&&d>0&&t>=d*.9)concluir(v,true);else if(Math.abs(t-lastSaveSec)>=10){lastSaveSec=t;agendaSalvar();}
}
function mountPlayer(v){
  killPlayer();const host=$('#ytp');if(!host)return;
  if(!v.yt){host.outerHTML='<div class="pmsg" id="ytp"><b>Vídeo ainda não cadastrado</b><span>'+(adm()?'Cole o link do YouTube em “Gerenciar módulos”.':'Esta aula será liberada em breve.')+'</span></div>';return;}
  const start=posOf(v.id);
  loadYT().then(()=>{
    if(V.name!=='play'||V.vid!==v.id||!$('#ytp'))return;
    const resume=!isDone(v.id)&&start>5&&start<dur(v)-15?Math.floor(start-2):0;
    YTP=new YT.Player('ytp',{videoId:v.yt,host:'https://www.youtube-nocookie.com',playerVars:{rel:0,modestbranding:1,playsinline:1,start:resume,origin:location.origin},events:{
      onStateChange:e=>{
        if(!YTP)return;
        if(e.data===1){clearInterval(ytTimer);ytTimer=setInterval(()=>{try{const d=YTP.getDuration();setPos(v,YTP.getCurrentTime(),d);}catch(x){}},2000);}
        else{clearInterval(ytTimer);ytTimer=null;try{if(e.data===2){setPos(v,YTP.getCurrentTime(),YTP.getDuration());agendaSalvar();}}catch(x){}
          if(e.data===0){concluir(v,true);}}
      },
      onError:()=>playerFallback(v)
    }});
  }).catch(()=>playerFallback(v));
}
function playerFallback(v){
  const h=$('#ytp');if(!h||V.vid!==v.id)return;
  const url='https://www.youtube.com/watch?v='+encodeURIComponent(v.yt);
  h.outerHTML='<div class="pmsg" id="ytp"><b>Não foi possível carregar o player aqui</b><span>Assista pelo YouTube e volte para marcar a aula como concluída.</span><a href="'+url+'" target="_blank" rel="noopener">Abrir no YouTube ↗</a></div>';
}
function concluir(v,auto){
  if(isDone(v.id)&&auto)return;
  PR.done[v.id]=1;PR.pos[v.id]=Math.max(PR.pos[v.id]||0,Math.floor(dur(v)*.9));marcaDia();salvarProg();
  toast(auto?'Aula concluída automaticamente.':'Aula marcada como concluída.');
  if(V.name==='play')refreshPlay();
  if(mdoneOf(PR,v.mod))setTimeout(()=>cert(v.mod.id),700);
}
function desmarcar(v){delete PR.done[v.id];PR.pos[v.id]=Math.min(PR.pos[v.id]||0,Math.floor(dur(v)*.5));salvarProg();refreshPlay();}
function markHtml(v){const dn=isDone(v.id);return '<button class="btn flow'+(dn?'':' pri')+'" id="mark">'+FLOW+(dn?CHECK+' Concluída':'Marcar como concluída')+'</button>';}
function sideHtml(v){const m=v.mod;return '<h3>'+esc(m.t)+'</h3>'+m.vids.map((x,i)=>'<button class="vrow" data-play="'+x.id+'"'+(x.id===v.id?' aria-current="true"':'')+'><span class="vnum'+(isDone(x.id)?' done':'')+'">'+(isDone(x.id)?CHECK:i+1)+'</span><span><span class="t">'+esc(x.t)+'</span><br><span class="s">'+x.min+' min</span></span></button>').join('');}
function tabsHtml(v){const nt=(NT[v.id]||[]).length,c=CMS[v.id];const nc=c?c.reduce((a,x)=>a+1+(x.re||[]).length,0):'';
  return '<button role="tab" data-tab="notas" aria-selected="'+(V.tab==='notas')+'">Minhas anotações ('+nt+')</button><button role="tab" data-tab="coments" aria-selected="'+(V.tab==='coments')+'">Comentários'+(c?' ('+nc+')':'')+'</button>';}
function refreshPlay(){ // atualiza só os pedaços da tela, sem recriar o player
  const v=vid(V.vid);if(!v||V.name!=='play')return;
  const a=$('#markwrap');if(a)a.innerHTML=markHtml(v)+(nextOf(v.id)?' <button class="btn" data-play="'+nextOf(v.id).id+'">Próxima aula</button>':'');
  const s=$('#sidelist');if(s)s.innerHTML=sideHtml(v);
  const b=$('#pbar');if(b){b.style.width=Math.round(vp(v)*100)+'%';b.parentElement.classList.toggle('ok',isDone(v.id));}
  const t=$('#tabs');if(t)t.innerHTML=tabsHtml(v);
  const p=$('#panel');if(p)p.innerHTML=V.tab==='notas'?panelNotas(v):panelCm(v);
}
function viewPlay(){
  const v=vid(V.vid);if(!v)return '<div class="card empty">Aula não encontrada.</div>';
  const m=v.mod;
  return '<div class="crumb"><button data-go="home">Módulos</button><span>/</span><button data-mod="'+m.id+'">'+esc(m.t)+'</button><span>/</span><span>'+esc(v.t)+'</span></div>'
  +'<div class="lay"><div style="min-width:0"><div class="player">'+art(m.c,seedOf(v.id))+'<div id="ytp"></div></div>'
  +'<div class="vhead"><div style="min-width:0"><div class="eyebrow">'+esc(m.t)+'</div><h1>'+blur(v.t)+'</h1><div class="muted">'+esc(v.d||'')+'</div></div><div style="display:flex;gap:8px;flex-wrap:wrap" id="markwrap"></div></div>'
  +'<div class="bar'+(isDone(v.id)?' ok':'')+'"><i id="pbar" style="width:'+Math.round(vp(v)*100)+'%"></i></div>'
  +'<div class="tabs" role="tablist" id="tabs"></div><div class="panel" id="panel"></div></div>'
  +'<aside class="card side" aria-label="Aulas do módulo" id="sidelist"></aside></div>';
}
function panelNotas(v){
  const nt=(NT[v.id]||[]).slice().sort((a,b)=>a.t-b.t);
  return '<div class="stack"><div class="field"><label for="nt">Nova anotação</label><textarea id="nt" maxlength="1000" placeholder="Escreva o que quer lembrar desta aula"></textarea></div><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><button class="btn pri" id="addnote">Salvar no minuto <span class="mono" id="nmin">'+fmt(curTime(v))+'</span></button><span class="muted">Só você vê suas anotações.</span></div>'
  +(nt.length?nt.map(n=>'<div class="note"><button class="ts" data-seek="'+n.t+'" title="Ir para este momento">'+fmt(n.t)+'</button><div style="min-width:0;overflow-wrap:anywhere;white-space:pre-wrap">'+esc(n.x)+'</div><button class="btn sm danger" data-delnote="'+n.id+'">Excluir</button></div>').join(''):'<div class="muted">Nenhuma anotação nesta aula ainda.</div>')+'</div>';
}
function curTime(v){try{if(YTP&&YTP.getCurrentTime)return YTP.getCurrentTime();}catch(e){}return posOf(v.id);}
function panelCm(v){
  const cs=CMS[v.id];if(!cs)return '<div class="muted">Carregando comentários…</div>';
  const quando=iso=>ago(iso)||'';
  const pode=c=>c.u===ME.usuario||adm();
  return '<div class="stack"><div class="field"><label for="cmt">Comentar ou perguntar</label><textarea id="cmt" maxlength="1000" placeholder="Compartilhe uma dúvida ou um aprendizado com o time"></textarea></div><div><button class="btn pri" id="addcm">Publicar comentário</button></div>'
  +(cs.length?cs.map(c=>{const lk=(c.likes||[]),li=lk.includes(ME.usuario);
    return '<div class="cm"><span class="av" style="background:'+colOf(c.u)+'">'+ini(c.who)+'</span><div style="min-width:0"><b>'+esc(c.who)+'</b> <span class="muted">· '+quando(c.em)+'</span><div style="overflow-wrap:anywhere;white-space:pre-wrap">'+esc(c.x)+'</div><div class="acts"><button data-like="'+c.id+'" class="'+(li?'on':'')+'">'+(li?'♥':'♡')+' '+lk.length+'</button><button data-reply="'+c.id+'">Responder</button>'+(pode(c)?'<button data-delcm="'+c.id+'">Excluir</button>':'')+'</div></div></div>'
    +(c.re||[]).map(r=>'<div class="cm reply"><span class="av" style="background:'+colOf(r.u)+'">'+ini(r.who)+'</span><div style="min-width:0"><b>'+esc(r.who)+'</b> <span class="muted">· '+quando(r.em)+'</span><div style="overflow-wrap:anywhere;white-space:pre-wrap">'+esc(r.x)+'</div>'+(pode(r)?'<div class="acts"><button data-delcm="'+r.id+'">Excluir</button></div>':'')+'</div></div>').join('')
    +(V.replyTo===c.id?'<div class="reply"><div class="field"><label for="rp">Sua resposta</label><textarea id="rp" maxlength="1000"></textarea></div><div style="margin-top:8px"><button class="btn pri sm" data-sendreply="'+c.id+'">Enviar resposta</button></div></div>':'');}).join(''):'<div class="muted">Ainda não há comentários. Seja a primeira.</div>')+'</div>';
}
async function carregaCm(v){
  try{const r=await api('GET','/coment/'+v.id);CMS[v.id]=r.itens;}catch(e){CMS[v.id]=[];}
  if(V.name==='play'&&V.vid===v.id)refreshPlay();
}

/* ---------- acompanhamento (admin) ---------- */
async function carregaTeam(){
  try{
    const [u,p]=await Promise.all([api('GET','/usuarios'),api('GET','/col/progresso')]);
    const pm={};p.docs.forEach(d=>{pm[d.id]=d.data;});
    TEAM=u.usuarios.filter(x=>x.papel==='func').map(x=>({...x,P:Object.assign(novoPR(),pm[x.chave]||{})}));
  }catch(e){fail(e);TEAM=[];}
  if(V.name==='team')render();

  if(t.dataset.mmv){const [id,d]=t.dataset.mmv.split('|');const i=TR.modulos.findIndex(m=>m.id===id),j=i+ +d;if(i<0||j<0||j>=TR.modulos.length)return;[TR.modulos[i],TR.modulos[j]]=[TR.modulos[j],TR.modulos[i]];await salvarTrilha();render();return;}

  if(t.dataset.reset){V.resetU=t.dataset.reset;render();const r=$('#u_r');if(r)r.focus();return;}
  if(t.dataset.doreset){const s=$('#u_r').value;await api('PUT','/usuarios/'+encodeURIComponent(t.dataset.doreset),{senha:s});V.resetU=null;toast('Senha redefinida.');render();return;}

  if(t.dataset.dodel){await api('DELETE','/usuarios/'+encodeURIComponent(t.dataset.dodel));V.confirm=null;toast('Acesso removido.');USERS=null;render();return;}
  }catch(x){fail(x);t.disabled=false;}
});

  // formas de traço fino (régua, compasso, esquadro, círculo...), bem sutis
  const shapes=[];
  const kinds=['ring','tri','arc','plus','sq','pencil','ring','tri'];
  const cols=[BLUE,YEL,RED,BLUE,YEL,BLUE,RED,YEL];
  kinds.forEach((k,i)=>shapes.push({k,c:cols[i],x:(i*.137+.08)%1,y:((i*.291)+.12)%1,s:22+((i*13)%28),rot:i*.9,vr:(i%2?1:-1)*(.04+.02*(i%3)),fx:.05+.01*i,fy:.04+.012*i,ph:i*1.3,d:.5+(i%4)*.35}));
  function size(){
    dpr=Math.min(window.devicePixelRatio||1,2);W=window.innerWidth;H=window.innerHeight;
    cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  function glow(x,y,r,c,a){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,'rgba('+c+','+a+')');g.addColorStop(.55,'rgba('+c+','+(a*.45)+')');g.addColorStop(1,'rgba('+c+',0)');ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2);}
  function shape(s,x,y){
    ctx.save();ctx.translate(x,y);ctx.rotate(s.rot);ctx.strokeStyle='rgba('+s.c+',.34)';ctx.lineWidth=1.4;ctx.lineCap='round';ctx.lineJoin='round';const r=s.s;ctx.beginPath();
    if(s.k==='ring'){ctx.arc(0,0,r,0,7);ctx.stroke();ctx.beginPath();ctx.arc(0,0,r*.45,0,7);ctx.globalAlpha=.6;ctx.stroke();}
    else if(s.k==='tri'){ctx.moveTo(-r,r*.7);ctx.lineTo(r,r*.7);ctx.lineTo(-r,-r*.9);ctx.closePath();ctx.stroke();}
    else if(s.k==='arc'){ctx.arc(0,0,r*1.2,.15,Math.PI*.95);ctx.stroke();ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(r*1.2*Math.cos(.15),r*1.2*Math.sin(.15));ctx.stroke();}
    else if(s.k==='plus'){ctx.moveTo(-r*.6,0);ctx.lineTo(r*.6,0);ctx.moveTo(0,-r*.6);ctx.lineTo(0,r*.6);ctx.stroke();}
    else if(s.k==='sq'){ctx.rect(-r*.6,-r*.6,r*1.2,r*1.2);ctx.stroke();}
    else{ctx.moveTo(-r*1.3,0);ctx.lineTo(r*.9,0);ctx.lineTo(r*1.3,-r*.18);ctx.lineTo(r*.9,-r*.36);ctx.lineTo(-r*1.3,-r*.36);ctx.closePath();ctx.stroke();}
    ctx.restore();
  }
  function frame(now){
    if(window.innerWidth!==W||window.innerHeight!==H)size();
    if(!W||!H){raf=0;return;}
    const t=reduce?0:(now-t0)/1000;
    m.sx+=(m.x-m.sx)*.05;m.sy+=(m.y-m.sy)*.05;m.son+=(m.on-m.son)*.05;
    ctx.clearRect(0,0,W,H);
    const mn=Math.min(W,H),ox=(m.sx-.5),oy=(m.sy-.5);
    // linhas de caderno + margem
    ctx.lineWidth=1;ctx.strokeStyle='rgba('+BLUE+',.07)';ctx.beginPath();
    for(let y=((t*6)%34)+.5;y<H;y+=34){ctx.moveTo(0,y);ctx.lineTo(W,y);}ctx.stroke();
    ctx.strokeStyle='rgba('+RED+',.10)';ctx.beginPath();const mx=Math.round(W*.115)+.5+ox*-14;ctx.moveTo(mx,0);ctx.lineTo(mx,H);ctx.stroke();
    // manchas
    blobs.forEach(b=>{
      const x=W*(b.x+b.ax*Math.sin(t*b.fx*2+b.p))+ox*mn*.18*b.d,y=H*(b.y+b.ay*Math.cos(t*b.fy*2+b.p))+oy*mn*.18*b.d;
      glow(x,y,mn*b.r*(1+.06*Math.sin(t*.4+b.p)),b.c,b.a);
    });
    shapes.forEach(s=>{
      s.rot+=reduce?0:s.vr*.016;
      const x=W*(s.x+.05*Math.sin(t*s.fx*3+s.ph))+ox*60*s.d,y=H*(s.y+.05*Math.cos(t*s.fy*3+s.ph))+oy*60*s.d;
      shape(s,x,y);
    });
    if(!reduce&&!root.hidden&&document.visibilityState==='visible')raf=requestAnimationFrame(frame);else raf=0;
  }
  function start(){if(root.hidden)return;if(!raf){t0=t0||performance.now();raf=requestAnimationFrame(frame);}}
  function setM(e){m.x=Math.max(0,Math.min(1,e.clientX/window.innerWidth));m.y=Math.max(0,Math.min(1,e.clientY/window.innerHeight));m.on=1;}
  window.addEventListener('pointermove',setM,{passive:true});
  window.addEventListener('pointerdown',setM,{passive:true});
  document.addEventListener('pointerleave',()=>{m.on=0;});
  window.addEventListener('resize',()=>{size();if(reduce&&!root.hidden)frame(performance.now());});
  document.addEventListener('visibilitychange',start);
  new MutationObserver(start).observe(root,{attributes:true,attributeFilter:['hidden']});
  start();if(reduce&&!root.hidden)frame(performance.now());
})();
</script></body></html>
